<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watercolor Rose</title>
  <style>
    :root {
      --paper: #f6f2ea;
      --ink: #3b332c;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #e9e4da;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .frame {
      width: min(90vw, 700px);
      aspect-ratio: 1;
      background: var(--paper);
      box-shadow: 0 18px 50px rgba(50, 40, 30, 0.18), 0 2px 6px rgba(50, 40, 30, 0.12);
      position: relative;
    }
    #watercolor {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--paper);
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #replay {
      appearance: none;
      border: 1px solid rgba(59, 51, 44, 0.35);
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      letter-spacing: 0.04em;
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.2s ease;
    }
    #replay:hover { background: rgba(255, 255, 255, 0.9); }
    #replay:disabled { opacity: 0.4; cursor: default; }
    .hint {
      font-size: 12px;
      opacity: 0.55;
      letter-spacing: 0.03em;
    }
    .lil-gui { --width: 280px; }
  </style>
  <script type="module" crossorigin src="./assets/index-DhECzSFQ.js"></script>
</head>
<body>
  <main>
    <div class="frame">
      <canvas id="watercolor" aria-label="Watercolor rose being painted"></canvas>
    </div>
    <div class="controls">
      <button id="replay" type="button">Replay</button>
    </div>
    <div class="hint">press D for the developer panel</div>
  </main>
</body>
</html>
